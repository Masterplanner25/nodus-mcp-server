[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus-mcp-server"
dynamic = ["version"]
description = "MCP server powered by the Nodus orchestration runtime"
authors = [{ name = "Shawn Knight", email = "shawnknight@the-master-plan.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "nodus", "orchestration", "agents", "llm", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  # >=5.15.0: 5.6.0 added the declared parameters resume depends on, and 5.15.0
  # keeps a run's bounds across a resume. Below 5.0.0 embedded code could read
  # and change the process environment by default.
  "nodus-lang>=5.15.0",
  # >=1.8: StreamableHTTPSessionManager first shipped there. Both SDK majors
  # are supported since 0.1.14 (#3); the branch is chosen once in server.py.
  "mcp>=1.8",
]

[project.scripts]
nodus-mcp-server = "nodus_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/Masterplanner25/nodus-mcp-server"
Repository = "https://github.com/Masterplanner25/nodus-mcp-server"
Issues = "https://github.com/Masterplanner25/nodus-mcp-server/issues"

[tool.setuptools.dynamic]
version = { attr = "nodus_mcp_server.__version__" }

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
nodus_mcp_server = ["goals/*.nd", "workflows/*.nd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
