name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The ends of requires-python.
        python: ["3.10", "3.13"]
        # server.py branches on the SDK major, so each branch needs its own run.
        mcp: ["mcp>=1,<2", "mcp>=2,<3"]
        include:
          # The floor in pyproject.toml.
          - os: ubuntu-latest
            python: "3.10"
            mcp: "mcp==1.22.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install . "${{ matrix.mcp }}" pytest httpx
      - name: Show what resolved
        run: python -m pip list
      - name: Test
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: The wheel installs only this package, and the workflows ship
        run: |
          python -m zipfile -l dist/*.whl > contents.txt
          cat contents.txt
          # An `if`, because `! grep` does not fail a step under `set -e`.
          if grep -E '^tests/' contents.txt; then
            echo "the wheel installs a top-level tests package"
            exit 1
          fi
          grep -q 'nodus_mcp_server/workflows/research.nd' contents.txt
      - name: The installed server answers a real handshake
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python - <<'PY'
          import json
          import subprocess

          import nodus_mcp_server

          proc = subprocess.Popen(
              ["/tmp/clean/bin/nodus-mcp-server", "--stdio"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True,
          )
          proc.stdin.write(json.dumps({
              "jsonrpc": "2.0", "id": 1, "method": "initialize",
              "params": {"protocolVersion": "2025-03-26", "capabilities": {},
                         "clientInfo": {"name": "ci", "version": "0"}},
          }) + "\n")
          proc.stdin.flush()
          info = json.loads(proc.stdout.readline())["result"]["serverInfo"]
          proc.terminate()
          assert info["name"] == "nodus-mcp-server", info
          assert info["version"] == nodus_mcp_server.__version__, info
          print(info)
          PY
